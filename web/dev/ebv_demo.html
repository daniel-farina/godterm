<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; background: #f4f1ea; color: #2b2d31; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 22px; background: #e9e4d8; border-bottom: 1px solid #d6d0c1; }
  header b { font-size: 16px; }
  nav { display: flex; gap: 14px; color: #5f6b73; }
  main { padding: 22px; max-width: 900px; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  p { margin: 0 0 16px; color: #5b5f66; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .card { background: #fbf9f4; border: 1px solid #d6d0c1; border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card span { color: #6c8b7a; font-size: 13px; }
  form { display: flex; gap: 8px; margin-top: 18px; }
  input { flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid #c9c2b2; border-radius: 8px; background: #fff; font: inherit; }
  button { height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: #6c8b7a; color: #fff; font: inherit; }
  .url { margin-top: 18px; font: 12px ui-monospace, Menlo, monospace; color: #7b7f86; overflow-wrap: anywhere; }
  .dot { position: fixed; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 2px solid #b0714f; }
</style>
</head>
<body>
<header><b id="site">My site</b><nav><span>Home</span><span>Docs</span><span>Pricing</span></nav></header>
<main>
  <h1 id="h">Local dev server</h1>
  <p>This is the mock embedded browser. In GodTerm the picture is a real Chrome page.</p>
  <div class="grid">
    <div class="card"><h3>Build</h3><span>passing, 42 s</span></div>
    <div class="card"><h3>Console</h3><span>0 errors</span></div>
    <div class="card"><h3>Network</h3><span>1 failed request</span></div>
  </div>
  <form><input id="i" placeholder="Type here"><button type="button">Save</button></form>
  <div class="url" id="u"></div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('u').textContent = q.get('url') || '';
  document.getElementById('i').value = q.get('typed') || '';
  if (q.get('url')) { try { document.getElementById('site').textContent = new URL(q.get('url')).host; } catch (e) {} }
  const c = (q.get('click') || '').split(',').map(Number);
  if (c.length === 2 && !isNaN(c[0])) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.style.left = (c[0] * innerWidth) + 'px';
    d.style.top = (c[1] * innerHeight) + 'px';
    document.body.append(d);
  }
</script>
</body>
</html>
