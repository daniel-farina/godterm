name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Blocking: the code base is rustfmt clean since 3496222. Run
  # `cargo fmt --all` before committing.
  fmt:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: ALSA headers (cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: clippy (advisory)
        continue-on-error: true
        run: cargo clippy --locked --all-targets -- -D warnings
      # Compiler warnings fail the build (clippy above stays advisory).
      - name: build
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo build --locked --all-targets
      # Timing sensitive tests (a helper process, a fake claude in a pty) can
      # lose a race on a loaded runner: a failed test is run again once, alone;
      # it must pass there, so a real failure still fails the job.
      - name: test
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set +e
          cargo test --locked --no-fail-fast -- --test-threads=4 2>&1 | tee test.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            failed=$(grep -E '^test .* \.\.\. FAILED$' test.log | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | sort -u)
            [ -n "$failed" ] || { echo "no failed tests found in the log (a build or setup error)"; exit "$rc"; }
            echo "re-running once, alone:"; echo "$failed"
            ok=0
            while read -r t; do
              [ -n "$t" ] || continue
              cargo test --locked -- --test-threads=1 --exact "$t" || ok=1
            done <<< "$failed"
            exit $ok
          fi
      # The real binary in tmux on the demo world (docs/TESTING.md).
      - name: e2e demo (tmux)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y --no-install-recommends tmux; else brew install tmux; fi
          python3 scripts/e2e/run.py --suite ci --bin target/debug/godterm --out e2e-results/ci
      - name: e2e screens
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: e2e-results/ci

  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo build --locked --all-targets
      - name: test (Unix only tests skipped, see .github/windows-test-skips.txt)
        shell: pwsh
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          $skips = Get-Content .github/windows-test-skips.txt | Where-Object { $_ -and -not $_.StartsWith('#') } | ForEach-Object { '--skip'; $_ }
          cargo test --locked --bin godterm -- --test-threads=1 @skips
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux-package:
    name: linux package (x86_64, Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: build and package in packaging/linux/Dockerfile
        env:
          LINUX_TARGETS: x86_64-unknown-linux-gnu
          PROFILE: release
        run: scripts/release/linux.sh
      - name: install the .deb and run it
        run: |
          sudo apt-get install -y ./dist/godterm_*_amd64.deb
          godterm --version
